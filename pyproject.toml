[project]
name = "swimtunes"
version = "0.1.0"
description = "Desktop app for transferring public source audio to swim headphones"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "yt-dlp>=2026.1.1,<2027",
]

[project.scripts]
swimtunes = "swimtunes.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/swimtunes"]
